name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    name: Vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # A patch that no longer applies would otherwise only blow up on a
      # user's machine. Verify against the commits pinned in versions.lock.
      - name: Verify patches apply cleanly
        run: |
          set -euo pipefail
          backend=$(grep -E '^backend\s*=' versions.lock | cut -d= -f2 | tr -d ' ')
          frontend=$(grep -E '^frontend\s*=' versions.lock | cut -d= -f2 | tr -d ' ')

          check() {
            repo=$1 commit=$2 dir=$(mktemp -d)
            if [ -z "$(ls -A "patches/$repo" 2>/dev/null | grep '\.patch$' || true)" ]; then
              echo "== $repo: no patches, skipping"
              return
            fi
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/NYCU-SDC/core-system-$repo.git"
            git -C "$dir" fetch -q --depth 1 origin "$commit"
            git -C "$dir" checkout -q FETCH_HEAD
            for p in patches/"$repo"/*.patch; do
              printf '== %-9s %s ... ' "$repo" "$(basename "$p")"
              git -C "$dir" apply "$GITHUB_WORKSPACE/$p"
              echo OK
            done
          }

          check backend "$backend"
          check frontend "$frontend"

  release:
    name: Build binaries
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}" arch="${target#*/}"
            name="core-system-launcher_${version}_${os}_${arch}"
            echo "building $name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags="-s -w -X 'main.Version=${version}'" \
              -o "dist/${name}/core-system-launcher" .
            tar -czf "dist/${name}.tar.gz" -C "dist/${name}" core-system-launcher
            rm -rf "dist/${name}"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
